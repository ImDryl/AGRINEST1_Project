version: "3.8"

services:
    mysql:
        image: mysql:8.0
        platform: linux/amd64
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: agrinest_root_password
            MYSQL_DATABASE: agrinest_db
            MYSQL_USER: agrinest_user
            MYSQL_PASSWORD: agrinest_password
        ports:
            - "3313:3306"
        volumes:
            - agrinest_mysql_data:/var/lib/mysql
        networks:
            - agrinest_network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        platform: linux/amd64
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            PMA_USER: root
            PMA_PASSWORD: agrinest_root_password
        ports:
            - "8082:80"
        depends_on:
            - mysql
        networks:
            - agrinest_network

volumes:
    agrinest_mysql_data:

networks:
    agrinest_network:
