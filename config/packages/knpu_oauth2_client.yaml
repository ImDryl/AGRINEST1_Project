knpu_oauth2_client:
    clients:
        google:
            type: google
            client_id: '%env(GOOGLE_OAUTH_CLIENT_ID)%'
            client_secret: '%env(GOOGLE_OAUTH_CLIENT_SECRET)%'
            # Full URL (must match Google Cloud → Authorized redirect URIs exactly)
            redirect_route: '%env(GOOGLE_OAUTH_REDIRECT_URI)%'
            redirect_params: {}
